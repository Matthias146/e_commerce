<form
  (ngSubmit)="doSearch(searchInput.value)"
  class="form-header flex items-center gap-2"
>
  <input
    #searchInput
    class="au-input au-input-xl"
    type="text"
    name="search"
    id="search"
    placeholder="Search for products ..."
    (input)="search(searchInput.value)"
  />

  <button
    type="submit"
    class="au-btn-submit"
  >
    Search
  </button>
</form>
