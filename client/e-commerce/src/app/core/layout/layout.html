<div class="min-h-screen bg-(--color-bg) lg:flex">
  <app-sidebar />

  <div class="flex min-h-screen min-w-0 flex-1 flex-col">
    <app-header />

    <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet />
    </main>

    <app-footer />
  </div>
  @if (cartMessage()) {
    <output
      class="fixed right-4 bottom-4 z-50 w-[calc(100%-2rem)] max-w-sm rounded-2xl border border-green-200 bg-green-50 px-5 py-4 shadow-lg sm:right-6 sm:bottom-6"
    >
      <div class="flex items-start gap-3">
        <div
          class="flex size-8 shrink-0 items-center justify-center rounded-full bg-green-100 font-bold text-green-700"
        >
          ✓
        </div>

        <div>
          <p class="font-semibold text-(--color-text)">Added to cart</p>

          <p class="mt-1 text-sm text-(--color-muted)">
            {{ cartMessage() }}
          </p>
        </div>
      </div>
    </output>
  }
</div>
