<header class="bg-(--color-primary) text-white shadow-sm">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="flex min-h-20 flex-wrap items-center gap-4 py-4 sm:gap-6">
      <button
        type="button"
        class="order-1 flex size-10 items-center justify-center rounded-lg text-white transition hover:bg-white/10 lg:hidden"
        aria-label="Open menu"
        (click)="toggleMenu()"
      >
        ☰
      </button>

      <div class="order-3 w-full min-w-0 sm:order-2 sm:flex-1 lg:order-1">
        <app-search />
      </div>

      <div class="order-2 ml-auto flex shrink-0 items-center gap-3 sm:order-3 sm:gap-5 lg:order-2">
        <app-card-status />

        @if (auth.isAuthenticated$ | async) {
          <a
            routerLink="/account/orders"
            class="rounded-lg px-3 py-2 text-sm font-medium transition hover:bg-white/10"
          >
            My Orders
          </a>

          <button
            type="button"
            (click)="logout()"
            class="rounded-lg border border-white/20 px-4 py-2 text-sm font-medium transition hover:bg-white/10"
          >
            Logout
          </button>
        } @else {
          <button
            type="button"
            (click)="login()"
            class="rounded-xl bg-(--color-accent) px-4 py-2.5 text-sm font-semibold text-white transition hover:brightness-110"
          >
            Login
          </button>
        }
      </div>
    </div>
  </div>

  @if (isMenuOpen()) {
    <button
      type="button"
      aria-label="Close menu"
      class="fixed inset-0 z-40 bg-black/20 lg:hidden"
      (click)="closeMenu()"
    ></button>

    <div
      class="absolute left-0 right-0 z-50 border-t border-white/10 bg-(--color-primary) px-6 py-4 lg:hidden"
    >
      <p class="mb-3 text-xs font-semibold uppercase tracking-wider text-slate-400">Categories</p>

      <nav>
        <ul class="space-y-1">
          @for (category of productCategories(); track category.id) {
            <li>
              <a
                [routerLink]="['/products/category', category.id]"
                routerLinkActive="bg-white/10 text-white"
                (click)="closeMenu()"
                class="block rounded-lg px-3 py-2.5 text-sm text-slate-200 transition hover:bg-white/10 hover:text-white"
              >
                {{ category.categoryName }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  }
</header>
