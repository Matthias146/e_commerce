<header class="header-desktop">
  <div class="section-content section-content-p30">
    <div class="w-full px-4">
      <div class="header-wrap flex items-center justify-between">
        <form
          class="form-header flex items-center gap-2"
          onsubmit="return false;"
          method="GET"
        >
          <input
            class="au-input au-input-xl"
            type="text"
            name="search"
            placeholder="Search for data ..."
          />

          <button
            class="au-btn-submit"
            type="submit"
          >
            Search
          </button>
        </form>

        <div class="cart-area hidden">
          <a href="shopping-detail.html" class="flex items-center gap-2">
            <div class="total">
              19.22 <span>2</span>
            </div>

            <i
              class="fa fa-shopping-cart"
              aria-hidden="true"
            ></i>
          </a>
        </div>
      </div>

      <div class="account-wrap"></div>
    </div>
  </div>
</header>
