<aside
  class="hidden w-64 shrink-0 border-r border-(--color-border) bg-(--color-surface) lg:block h-full"
>
  <div class="border-b border-(--color-border) px-6 py-5">
    <a routerLink="/products" class="flex items-center justify-center">
      <img src="/images/logo.png" alt="logo" class="h-10 w-auto" />
    </a>
  </div>

  <nav class="p-4">
    <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-(--color-muted)">
      Categories
    </p>

    <ul class="space-y-1">
      @for (category of productCategories(); track category.id) {
        <li>
          <a
            [routerLink]="['/products/category', category.id]"
            routerLinkActive="bg-slate-100 text-[var(--color-text)] font-semibold"
            class="block rounded-lg px-3 py-2.5 text-sm text-(--color-muted) transition hover:bg-slate-50 hover:text-(--color-text)"
          >
            {{ category.categoryName }}
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
