<div class="section-content section-content-p30">
  <div class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    <!-- Product Grid -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (tempProduct of products(); track tempProduct.id) {
        <article
          class="flex min-h-[420px] flex-col rounded-2xl border border-gray-200 bg-white p-4 shadow-sm"
        >
          <a
            [routerLink]="[tempProduct.id]"
            class="flex h-56 items-center justify-center rounded-xl bg-gray-50 p-4"
          >
            <img
              [ngSrc]="tempProduct.imageUrl"
              [alt]="tempProduct.name"
              width="250"
              height="200"
              class="h-full w-full object-contain"
            />
          </a>

          <div class="flex flex-1 flex-col pt-5 items-center justify-center text-align-center">
            <a [routerLink]="[tempProduct.id]" class="block min-h-[4rem] h-14 my-8">
              <h2 class="line-clamp-2 text-lg font-semibold leading-7 text-gray-800">
                {{ tempProduct.name }}
              </h2>
            </a>

            <p class="mt-2 text-xl font-bold text-gray-900">
              {{ tempProduct.unitPrice | currency: 'EUR' }}
            </p>

            <button
              type="button"
              class="mt-auto w-2/3 rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700"
              (click)="addToCart(tempProduct)"
            >
              Add to Cart
            </button>
          </div>
        </article>
      } @empty {
        <div class="col-span-full flex justify-center py-16">
          <div
            role="alert"
            class="flex max-w-lg items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 px-5 py-4 text-amber-900"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 shrink-0 stroke-current"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
              />
            </svg>

            <span class="font-medium">No products found.</span>
          </div>
        </div>
      }
    </div>

    <!-- Pagination -->
    @if (totalElements > 0) {
      <div
        class="mt-10 flex flex-col items-center gap-5 border-t border-gray-200 pt-7 sm:flex-row sm:justify-between"
      >
        <p class="text-sm font-medium text-gray-700">{{ totalElements }} products</p>

        <div class="flex items-center gap-3">
          <button
            type="button"
            class="rounded-xl border border-gray-300 bg-white px-5 py-2.5 font-semibold text-gray-800 shadow-sm transition hover:border-gray-400 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40"
            [disabled]="pageNumber() === 1"
            (click)="previousPage()"
          >
            ← Previous
          </button>

          <div
            class="min-w-28 rounded-xl border border-gray-200 bg-gray-50 px-5 py-2.5 text-center font-semibold text-gray-900 shadow-sm"
          >
            {{ pageNumber() }} / {{ totalPages }}
          </div>
          <div class="flex items-center gap-3 justify-end w-40">
            <button
              type="button"
              class="rounded-xl border border-gray-300 bg-white px-5 py-2.5 font-semibold text-gray-800 shadow-sm transition hover:border-gray-400 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40"
              [disabled]="pageNumber() >= totalPages"
              (click)="nextPage()"
            >
              Next →
            </button>
            <select
              class="select w-10"
              [value]="pageSize()"
              #pageSelect
              (change)="updatePageSize(+pageSelect.value)"
            >
              <option value="5" >5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>
      </div>
    }
  </div>
</div>
