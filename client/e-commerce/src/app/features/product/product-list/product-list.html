<div class="section-content section-content-p30">
  <div class="w-full px-4">

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">

      @for (tempProduct of products(); track $index) {

        <div class="product-box">

          <img
            [ngSrc]="tempProduct.imageUrl"
            [alt]="tempProduct.name"
            width="250"
            height="200"
            class="h-64 w-full rounded-lg object-contain"
          />

          <h1 class="mt-4 text-lg font-semibold">
            {{ tempProduct.name }}
          </h1>

          <div class="price mt-2">
            {{ tempProduct.unitPrice | currency:'EUR' }}
          </div>

          <a href="#" class="primary-btn mt-4 inline-block">
            Add to Cart
          </a>

        </div>

      } @empty {

        <div class="col-span-full py-16 text-center text-gray-500">
          No products found.
        </div>


      }

    </div>

  </div>
</div>
