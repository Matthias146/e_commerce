<div class="section-content section-content-p30">
  <div class="w-full px-4">

    <div class="overflow-hidden rounded-lg bg-white shadow">
      <div class="overflow-x-auto">

        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-800 text-white">
          <tr>
            <th class="px-6 py-3">
              <div class="flex items-center gap-2">
                <svg
                  lucideImage
                  class="h-4 w-4">
                </svg>
                <span>Image</span>
              </div>
            </th>
            <th class="px-6 py-3">
              <div class="flex items-center gap-2">
                <svg
                  lucidePackage
                  class="h-4 w-4">
                </svg>

                <span>Name</span>
              </div>
            </th>
            <th class="px-6 py-3">
              <div class="flex items-center gap-2">
                <svg
                  lucideBadgeEuro
                  class="h-4 w-4">
                </svg>

                <span>Price</span>
              </div>
            </th>
            <th class="px-6 py-3">
              <div class="flex items-center gap-2">
                <svg
                  lucideBoxes
                  class="h-4 w-4">
                </svg>

                <span>Stock</span>
              </div>
            </th>
          </tr>
          </thead>

          <tbody class="divide-y divide-gray-200 bg-white">
            @for (tempProduct of products(); track $index) {
              <tr class="transition hover:bg-gray-50">
                <td class="px-6 py-4">
                  <img
                    [ngSrc]="tempProduct.imageUrl"
                    [alt]="tempProduct.name"
                    width="70"
                    height="70"
                    class="h-16 w-16 rounded-md object-contain"
                  />
                </td>

                <td class="px-6 py-4 font-medium text-gray-900">
                  {{ tempProduct.name }}
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-gray-700">
                  {{ tempProduct.unitPrice | currency: "EUR" }}
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-gray-700">
                  {{ tempProduct.unitsInStock }}
                </td>
              </tr>
            } @empty {
              <tr>
                <td
                  colspan="4"
                  class="px-6 py-12 text-center text-gray-500"
                >
                  No products found.
                </td>
              </tr>
            }
          </tbody>
        </table>

      </div>
    </div>

  </div>
</div>
