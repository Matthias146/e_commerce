<div class="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
  @if (product(); as product) {
    <div class="grid gap-10 lg:grid-cols-2">
      <!-- Product Image -->
      <div
        class="flex min-h-105 items-center justify-center rounded-2xl border border-(--color-border) bg-(--color-surface) p-8"
      >
        <img
          [ngSrc]="product.imageUrl"
          [alt]="product.name"
          width="300"
          height="400"
          class="max-h-105 w-full object-contain"
        />
      </div>

      <!-- Product Info -->
      <div class="flex flex-col justify-center">
        <p class="mb-3 text-sm font-semibold uppercase tracking-wider text-(--color-accent)">
          Product Details
        </p>

        <h1 class="text-3xl font-bold tracking-tight text-(--color-text) sm:text-4xl">
          {{ product.name }}
        </h1>

        <p class="mt-5 text-3xl font-bold text-(--color-text)">
          {{ product.unitPrice | currency: 'EUR' }}
        </p>

        <button
          type="button"
          (click)="addToCart()"
          class="mt-8 w-full rounded-xl bg-(--color-primary) px-6 py-3 font-semibold text-white transition hover:bg-(--color-primary-hover) sm:w-auto"
        >
          Add to Cart
        </button>

        <div class="mt-10 border-t border-(--color-border) pt-8">
          <h2 class="text-lg font-semibold text-(--color-text)">Description</h2>

          <p class="mt-3 max-w-xl leading-7 text-(--color-muted)">
            {{ product.description }}
          </p>
        </div>

        <a
          routerLink="/products"
          class="mt-8 inline-flex w-fit items-center gap-2 text-sm font-semibold text-[var(--color-muted)] transition hover:text-[var(--color-text)]"
        >
          ← Back to products
        </a>
      </div>
    </div>
  }
</div>
