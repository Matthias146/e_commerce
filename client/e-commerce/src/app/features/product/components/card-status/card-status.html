<a
  routerLink="/cart-details"
  class="relative flex h-11 w-11 items-center justify-center rounded-xl text-white transition hover:bg-white/10"
>
  <svg lucideShoppingCart></svg>

  @if (totalQuantity() > 0) {
    <span
      class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-(--color-accent) px-1 text-xs font-bold text-white"
    >
      {{ totalQuantity() }}
    </span>
  }
</a>
