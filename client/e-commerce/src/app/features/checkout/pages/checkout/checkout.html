<div class="mx-auto w-full max-w-5xl px-2 py-6 sm:px-4 sm:py-8 lg:px-8 lg:py-10">
  <div class="mb-6 sm:mb-8">
    <p class="text-sm font-semibold uppercase tracking-wider text-(--color-accent)">Checkout</p>

    <h1 class="mt-2 text-2xl font-bold tracking-tight text-(--color-text) sm:text-3xl">
      Complete your Order
    </h1>

    <p class="mt-2 text-(--color-muted)">
      Enter your details and review your order before purchasing.
    </p>
  </div>

  <form [formRoot]="checkoutForm" class="space-y-5 sm:space-y-6">
    <app-contact-form [contactForm]="checkoutForm.contact" />

    <app-shipping-address-form
      [shippingForm]="checkoutForm.shippingAddress"
      [billingSameAsShipping]="checkoutForm.billingSameAsShipping"
    />

    @if (!checkoutModel().billingSameAsShipping) {
      <app-billing-address-form [billingAddressForm]="checkoutForm.billingAddress" />
    }

    <app-payment-form />

    <section
      class="rounded-2xl border border-(--color-border) bg-(--color-surface) p-5 shadow-sm sm:p-6"
    >
      <h2 class="text-lg font-semibold text-(--color-text) sm:text-xl">Review your Order</h2>

      <div class="mt-5 space-y-3">
        <div class="flex items-center justify-between gap-4 text-(--color-muted)">
          <span>Total Quantity</span>

          <span class="font-semibold text-(--color-text)">
            {{ totalQuantity() }}
          </span>
        </div>

        <div class="flex items-center justify-between gap-4 border-t border-(--color-border) pt-4">
          <span class="text-lg font-semibold text-(--color-text)"> Total </span>

          <span class="text-xl font-bold text-(--color-text) sm:text-2xl">
            {{ totalPrice() | currency: 'EUR' }}
          </span>
        </div>
      </div>
    </section>

    @if (orderError()) {
      <div
        role="alert"
        class="rounded-2xl border border-red-200 bg-red-50 px-4 py-4 shadow-sm sm:px-5"
      >
        <p class="font-semibold text-(--color-error)">Order failed</p>

        <p class="mt-1 text-sm text-(--color-error)">
          {{ orderError() }}
        </p>
      </div>
    }

    <div class="flex justify-end">
      <button
        type="submit"
        [disabled]="checkoutForm().invalid() || isSubmitting()"
        class="w-full rounded-xl bg-(--color-primary) px-6 py-3 font-semibold text-white transition hover:bg-(--color-primary-hover) disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 sm:w-auto"
      >
        @if (isSubmitting()) {
          <span class="flex items-center justify-center gap-2">
            <span
              class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
            ></span>

            Processing...
          </span>
        } @else {
          Purchase
        }
      </button>
    </div>
  </form>
</div>
