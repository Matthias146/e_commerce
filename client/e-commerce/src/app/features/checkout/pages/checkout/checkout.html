<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container">
      <form [formRoot]="checkoutForm">
        <app-contact-form [contactForm]="checkoutForm.contact" />
        <app-shipping-address-form
          [shippingForm]="checkoutForm.shippingAddress"
          [billingSameAsShipping]="checkoutForm.billingSameAsShipping"
        />
        @if (!checkoutModel().billingSameAsShipping) {
          <app-billing-address-form [billingAddressForm]="checkoutForm.billingAddress" />
        }
        <app-payment-form [paymentForm]="checkoutForm.creditCard" />
        <div class="form-area">
          <h3>Review your Order</h3>
          <p>Total Quantity: {{ totalQuantity() }}</p>
          <p>Total Price: {{ totalPrice() | currency: 'EUR' }}</p>
        </div>
        <div class="text-center">
          <button
            type="submit"
            [disabled]="checkoutForm().invalid()"
            class="rounded-lg bg-indigo-600 px-4 py-2 text-white disabled:cursor-not-allowed disabled:bg-gray-500 disabled:opacity-60"
          >
            Purchase
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
