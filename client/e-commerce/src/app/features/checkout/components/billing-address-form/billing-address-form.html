<fieldset class="form-area">
  <h3>Billing Address</h3>
  <div class="row">
    <div class="col-md-2">
      <label for="billing-country">Country</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <select
          #countrySelect
          id="billing-country"
          [formField]="billingAddressForm().country"
          (change)="onCountryChange(countrySelect.value)"
        >
          @for (country of countries(); track country.id) {
            <option [value]="country.code">
              {{ country.name }}
            </option>
          }
        </select>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="billing-street">Street</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input
          type="text"
          placeholder="Street"
          id="billing-street"
          [formField]="billingAddressForm().street"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="billing-city">City</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input
          type="text"
          placeholder="City"
          id="billing-city"
          [formField]="billingAddressForm().city"
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-2">
        <label for="billing-state">State</label>
      </div>
      <div class="col-md-9">
        <div class="input-space">
          <select id="billing-state" [formField]="billingAddressForm().state">
            @for (state of states(); track state.id) {
              <option [value]="state.name">
                {{ state.name }}
              </option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="billing-zipCode">Zip Code</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input
          type="text"
          placeholder="Zip Code"
          id="billing-zipCode"
          [formField]="billingAddressForm().zipCode"
        />
      </div>
    </div>
  </div>
</fieldset>
