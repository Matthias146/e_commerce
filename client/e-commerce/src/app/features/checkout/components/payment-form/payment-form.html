<fieldset class="form-area">
  <h3>Credit Card</h3>
  <div class="row">
    <div class="col-md-2">
      <label for="cardType">Card Type</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <select id="cardType" [formField]="paymentForm().cardType">
          <option value="USA">Visa</option>
          <option value="Canada">MasterCard</option>
        </select>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="cardName">Name on Card</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input
          type="text"
          placeholder="Name on Card"
          id="cardName"
          [formField]="paymentForm().nameOnCard"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="cardNumber">Card Number</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input
          type="text"
          placeholder="Card Number"
          id="cardNumber"
          [formField]="paymentForm().cardNumber"
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-2">
        <label for="cvv">CVV</label>
      </div>
      <div class="col-md-9">
        <div class="input-space">
          <input type="text" id="cvv" [formField]="paymentForm().cvv" />
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="expirationDate-month">Expiration Date</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input type="month" id="expirationDate-month" [formField]="paymentForm().expirationDate" />
        @if (paymentForm().expirationDate().invalid()) {
          @for (error of paymentForm().expirationDate().errors(); track error.kind) {
            <p>
              {{ error.message }}
            </p>
          }
        }
      </div>
    </div>
  </div>
</fieldset>
