<fieldset class="form-area">
  <h3>Customer</h3>
  <div class="row">
    <div class="col-md-2">
      <label for="firstName" class="block text-sm font-medium text-white">First Name</label>
    </div>
    <div class="col-md-9">
      <div class="input-space relative items-center">
        <input
          type="text"
          placeholder="First Name"
          id="firstName"
          [formField]="contactForm().firstName"
          class="w-full rounded-xl border bg-slate-800 px-4 py-3 pr-11 text-white outline-none transition placeholder:text-slate-400 focus:ring-2"
          [class.border-red-500]="
            contactForm().firstName().invalid() && contactForm().firstName().touched()
          "
          [class.text-red-400]="
            contactForm().firstName().invalid() && contactForm().firstName().touched()
          "
          [class.focus:border-red-500]="
            contactForm().firstName().invalid() && contactForm().firstName().touched()
          "
          [class.focus:ring-red-500]="
            contactForm().firstName().invalid() && contactForm().firstName().touched()
          "
          [class.border-slate-600]="contactForm().firstName().valid()"
          [class.focus:border-green-500]="contactForm().firstName().valid()"
          [class.focus:ring-green-500]="contactForm().firstName().valid()"
          [class.ring-green-500]="
            contactForm().firstName().valid() && contactForm().firstName().touched()
          "
          [class.ring-2]="contactForm().firstName().touched()"
          [class.ring-red-500]="
            contactForm().firstName().invalid() && contactForm().firstName().touched()
          "
        />
        @if (contactForm().firstName().invalid() && contactForm().firstName().touched()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="absolute right-3 top-1/2 size-5 -translate-y-full text-red-400"
          >
            <path
              fill-rule="evenodd"
              d="M2.25 12a9.75 9.75 0 1 1 19.5 0 9.75 9.75 0 0 1-19.5 0Zm10.5-4.5a.75.75 0 0 0-1.5 0v5.25a.75.75 0 0 0 1.5 0V7.5Zm0 9a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"
              clip-rule="evenodd"
            />
          </svg>
        }
        @if (contactForm().firstName().touched() && contactForm().firstName().invalid()) {
          @for (error of contactForm().firstName().errors(); track error.kind) {
            <p class="text-sm text-red-400">
              {{ error.message }}
            </p>
          }
        }
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="lastName">Last Name</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input
          type="text"
          placeholder="Last Name"
          id="lastName"
          [formField]="contactForm().lastName"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-2">
      <label for="email">Email</label>
    </div>
    <div class="col-md-9">
      <div class="input-space">
        <input type="email" placeholder="email" id="email" [formField]="contactForm().email" />
      </div>
    </div>
  </div>
</fieldset>
